arazzo: 1.0.0

info:
  title: Generate OAuth2 Client Credentials
  summary: Create an app, subscribe, and generate OAuth2 client credentials for a Cloud Gateway API
  description: |
    Targeted credential-generation workflow for Cloud Gateway APIs secured with OAuth2.

    ## When to use
    Only when gateway_vendor is NOT "wso2/api-platform" and securitySchemes contains oauth2.

    ## Pre-requisites
    The agent MUST have already:
      1. Discovered the API (via discover-api workflow).
      2. Built the integration code using the API spec with placeholder credentials.
    Do NOT invoke this workflow until the integration code is written.

    ## Flow
      1. Verify oauth2 security scheme is present.
      2. Extract tokenUrl and supported grant types.
      3. Create an application named "agent-<apiHandle>-app".
      4. Subscribe the application to the API.
      5. Generate OAuth2 client credentials (clientId + clientSecret).

    ## Token exchange
    This portal issues client credentials — the agent implements the token exchange:
      POST <tokenUrl>
      Content-Type: application/x-www-form-urlencoded
      grant_type=client_credentials&client_id=<clientId>&client_secret=<clientSecret>

  version: 1.0.0

workflows:

  - workflowId: generate-oauth2-credentials
    summary: Create an app, subscribe, and generate OAuth2 client credentials for a Cloud Gateway API
    description: |
      Targeted credential-generation workflow for Cloud Gateway APIs secured with OAuth2.

      ## Pre-conditions (caller must verify before invoking)
        - gateway_vendor is NOT "wso2/api-platform"
        - securitySchemes (fetched from the API) contains an oauth2 entry
        - Integration code is ALREADY BUILT using the API spec

      ## What this workflow does
        1. Verifies the oauth2 scheme is present in the fetched security scheme data.
        2. Extracts the tokenUrl and supported grant types from securitySchemes so
           the agent has everything it needs for token acquisition.
        3. Creates an application named "agent-<apiHandle>-app".
        4. Subscribes the application to the API (human_approval gate — may incur costs).
        5. Generates OAuth2 client credentials (clientId and clientSecret) for the app.

      ## What this workflow does NOT do
        Token exchange is NOT performed here. The portal issues client credentials —
        the agent must implement the token acquisition flow in the client application:
          POST <tokenUrl>
          Content-Type: application/x-www-form-urlencoded
          grant_type=client_credentials&client_id=<clientId>&client_secret=<clientSecret>

        All fields required for this call are returned in the workflow outputs.
    x-agent-access:
      level: full

    inputs:
      type: object
      required:
        - orgName
        - bearerToken
        - apiId
        - apiHandle
        - apiName
        - securitySchemes
      properties:
        orgName:
          type: string
          description: Organisation name — first path segment of any portal URL.
        bearerToken:
          type: string
          description: User-scoped portal bearer token.
        apiId:
          type: string
          description: ID of the target API. Available from discover-api workflow outputs.
        apiHandle:
          type: string
          description: URL-safe handle of the API. Used in application naming.
        apiName:
          type: string
          description: Display name of the API. Used in application description.
        securitySchemes:
          type: object
          description: >
            securitySchemes object already fetched from the API
            (discover-api workflow output: securitySchemes).
            Must contain an oauth2 entry for this workflow to proceed.
        subscriptionPlans:
          type: array
          description: >
            Subscription plans fetched from the API (discover-api workflow output:
            subscriptionPlans). Used to select the default plan when subscriptionPlan
            is not specified.
        keyType:
          type: string
          enum: [PRODUCTION, SANDBOX]
          description: Whether to generate production or sandbox credentials.
          default: SANDBOX
        subscriptionPlan:
          type: string
          description: >
            Subscription plan name to subscribe under (e.g. "Bronze", "Gold").
            If omitted, the first available plan from subscriptionPlans is used.

    steps:

      # ─── Step 1: Verify OAuth2 Security Scheme ───────────────────────────────
      - stepId: verify-oauth2-scheme
        description: >
          Check that the fetched API's securitySchemes contains an oauth2 entry.
          Also extracts the tokenUrl and supported grant types so they can be
          passed through to the caller without any additional HTTP calls.
          Stops here if not found — caller should use the api_key workflow instead.
        x-no-operation: true
        successCriteria:
          - condition: "'oauth2' in $inputs.securitySchemes"
        outputs:
          tokenUrl: $inputs.securitySchemes.oauth2.flows.clientCredentials.tokenUrl
          scopes: $inputs.securitySchemes.oauth2.flows.clientCredentials.scopes
          supportedGrantTypes: "'client_credentials'"
        onSuccess:
          - name: proceed-to-create-app
            type: goto
            stepId: create-application
        onFailure:
          - name: wrong-security-scheme
            type: end
            description: >
              No oauth2 security scheme found in the fetched API data.
              Use the api_key credential path for this API instead.

      # ─── Step 2: Create Application ──────────────────────────────────────────
      - stepId: create-application
        description: >
          Create a new application named "agent-<apiHandle>-app" to hold the
          OAuth2 client credentials. The name clearly marks it as agent-created.
          Falls back to list-applications on 409 (application already exists).
        x-rest-endpoint: "POST {portalHost}/devportal/organizations/{orgName}/applications"
        parameters:
          - name: orgName
            in: path
            value: $inputs.orgName
          - name: Authorization
            in: header
            value: Bearer $inputs.bearerToken
        requestBody:
          contentType: application/json
          payload:
            name: "agent-{$inputs.apiHandle}-app"
            description: "Agent-created application for {$inputs.apiName} (OAuth2). Created automatically."
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          applicationId: $response.body.applicationId
          applicationName: $response.body.name
        onSuccess:
          - name: proceed-to-subscribe
            type: goto
            stepId: subscribe-to-api
        onFailure:
          - name: app-already-exists
            type: goto
            stepId: list-applications
            criteria:
              - condition: $statusCode == 409

      # ─── Step 2b: List Applications (fallback) ───────────────────────────────
      - stepId: list-applications
        description: >
          Application already exists. Fetch and reuse it rather than creating
          a duplicate.
        x-rest-endpoint: "GET {portalHost}/devportal/organizations/{orgName}/applications"
        parameters:
          - name: orgName
            in: path
            value: $inputs.orgName
          - name: Authorization
            in: header
            value: Bearer $inputs.bearerToken
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          applicationId: $response.body[0].applicationId
          applicationName: $response.body[0].name
        onSuccess:
          - name: proceed-to-subscribe
            type: goto
            stepId: subscribe-to-api

      # ─── Step 3: Subscribe to API ────────────────────────────────────────────
      - stepId: subscribe-to-api
        description: >
          Subscribe the agent-created application to the API under the chosen plan.
          Uses the first available plan from subscriptionPlans if subscriptionPlan
          is not specified.
          Subscribing may incur costs — confirm with the operator before proceeding.
        x-agent-access:
          level: human_approval
          reason: >
            Subscribing creates a formal relationship and may incur billing charges
            depending on the chosen plan. Confirm the plan with the operator before
            proceeding.
        x-rest-endpoint: "POST {portalHost}/devportal/organizations/{orgName}/subscriptions"
        parameters:
          - name: orgName
            in: path
            value: $inputs.orgName
          - name: Authorization
            in: header
            value: Bearer $inputs.bearerToken
        requestBody:
          contentType: application/json
          payload:
            applicationID: $steps.create-application.outputs.applicationId
            apiId: $inputs.apiId
            policyName: $inputs.subscriptionPlan != null ? $inputs.subscriptionPlan : $inputs.subscriptionPlans[0].name
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          subscriptionId: $response.body.subscriptionId
        onSuccess:
          - name: proceed-to-generate-credentials
            type: goto
            stepId: generate-client-credentials
        onFailure:
          - name: already-subscribed
            type: goto
            stepId: generate-client-credentials
            criteria:
              - condition: $statusCode == 409
            description: Already subscribed — proceed to credential generation.

      # ─── Step 4: Generate OAuth2 Client Credentials ──────────────────────────
      - stepId: generate-client-credentials
        description: >
          Generate OAuth2 client credentials (clientId and clientSecret) for the
          subscribed application. These credentials are used by the client
          application to acquire access tokens from the tokenUrl.

          The portal issues the credentials — it does NOT perform token exchange.
          The agent must implement the following in the client application:

            POST <tokenUrl>
            Content-Type: application/x-www-form-urlencoded

            grant_type=client_credentials
            &client_id=<clientId>
            &client_secret=<clientSecret>

          All required values are returned in this workflow's outputs.

          Now plug these credentials into your integration code and verify
          the token exchange and API calls work end-to-end.
        x-rest-endpoint: "POST {portalHost}/devportal/organizations/{orgName}/applications/{applicationId}/generate-keys"
        parameters:
          - name: orgName
            in: path
            value: $inputs.orgName
          - name: applicationId
            in: path
            value: $steps.create-application.outputs.applicationId
          - name: Authorization
            in: header
            value: Bearer $inputs.bearerToken
        requestBody:
          contentType: application/json
          payload:
            keyType: $inputs.keyType
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          clientId: $response.body.clientId
          clientSecret: $response.body.clientSecret
          keyMappingId: $response.body.keyMappingId

    outputs:
      clientId: $steps.generate-client-credentials.outputs.clientId
      clientSecret: $steps.generate-client-credentials.outputs.clientSecret
      tokenUrl: $steps.verify-oauth2-scheme.outputs.tokenUrl
      scopes: $steps.verify-oauth2-scheme.outputs.scopes
      supportedGrantTypes: $steps.verify-oauth2-scheme.outputs.supportedGrantTypes
      applicationId: $steps.create-application.outputs.applicationId
      applicationName: $steps.create-application.outputs.applicationName
